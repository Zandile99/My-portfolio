<head>

    <title>Zandile Kama | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile">
            <div class="profile-circle">
                ZK
            </div>
            <h2>Zandile Kama</h2>
            <p>My Portfolio</p>
        </div>
        <!-- NAVIGATION -->
        <nav>
            <a href="index.html"> 🏠 Home </a>
            <a href="about.html"> 👩 About Me</a>
            <a href="family.html"> 👨‍👩‍👧 Family</a>

        </nav>
        <button id="darkModeBtn">

        </button>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="content">
        <section class="card">
            <h1>Contact Me 📞 </h1>
            <p>
                If you would like to get in touch with me,  you can use the form below.
            </p>
            <form id="contactForm">
                <label for="name"> Name </label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name" >
                <label for="email"> Email </label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email" >
                <label for="message"> Message </label>
                <textarea
                    id="message"
                    placeholder="Write your message" ></textarea>
                <button
                    type="submit"
                    class="button" > Send Message </button>
            </form>
        </section>
        </main>
      <script src="script.js"></script>
</body>
